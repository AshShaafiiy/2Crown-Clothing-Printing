version: '3.8'

services:
  app:
    build:
      context: .
      target: production
    image: 2crown-app:latest
    restart: unless-stopped
    stop_grace_period: 20s
    environment:
      - NODE_ENV=production
      - PORT=4000
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS-http://localhost,http://127.0.0.1}
      - DATABASE_URL=/data/prod.sqlite3
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
    volumes:
      - db_data:/data
    expose:
      - "4000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  caddy:
    build:
      context: .
      target: caddy_server
    image: 2crown-caddy:latest
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

volumes:
  db_data:
  caddy_data:
  caddy_config:
